spring.application.name=huerto-api
server.port=8080

# Base de datos creada con huerto_escolar.sql en XAMPP (phpMyAdmin)
spring.datasource.url=jdbc:mysql://localhost:3306/huerto_escolar?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Las tablas las crea el script SQL, Hibernate no las toca
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
